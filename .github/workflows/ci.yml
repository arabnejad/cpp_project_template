name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Debug (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
          - compiler: Clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake --preset development -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset development --parallel

      - name: Test
        run: ctest --preset development

  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake --preset release -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset release --parallel

      - name: Test
        run: ctest --preset release

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake --preset sanitizers -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset sanitizers --parallel

      - name: Test
        run: ctest --preset sanitizers

  quality:
    name: Formatting and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format cppcheck

      - name: Configure
        run: cmake --preset development -DBUILD_TESTING=OFF

      - name: Check formatting
        run: cmake --build --preset development --target clang_format_check

      - name: Run cppcheck
        run: cmake --build --preset development --target cppcheck

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcovr

      - name: Configure
        run: cmake --preset coverage -DWARNINGS_AS_ERRORS=ON

      - name: Generate console report
        run: cmake --build --preset coverage-console --parallel

      - name: Generate HTML report
        run: cmake --build --preset coverage-html --parallel

      - name: Upload HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: build-coverage/coverage/
          if-no-files-found: error
          retention-days: 14
